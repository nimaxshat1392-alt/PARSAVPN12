name: Build PARSA VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      # ═══════════════════════════════════════════════════
      #  مرحله ۱: فیکس خودکار App.kt
      # ═══════════════════════════════════════════════════
      - name: Fix App.kt automatically
        run: |
          echo "🔧 در حال اجرای اسکریپت فیکس..."
          chmod +x fix_app.sh
          bash fix_app.sh
          echo "✅ فیکس کامل شد"

      # ═══════════════════════════════════════════════════
      #  مرحله ۲: ساخت ساختار پروژه
      # ═══════════════════════════════════════════════════
      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/mlmvpn/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/xml
          mkdir -p app/libs
          mkdir -p gradle/wrapper
          
          # انتقال App.kt به مسیر درست
          mv App.kt app/src/main/java/com/mlmvpn/app/App.kt

      # ═══════════════════════════════════════════════════
      #  مرحله ۳: دانلود خودکار libXray.aar
      # ═══════════════════════════════════════════════════
      - name: Download libXray.aar
        run: |
          echo "📥 در حال گرفتن آخرین نسخه AndroidLibXrayLite..."
          
          LATEST=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "آخرین نسخه: $LATEST"
          
          URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/${LATEST}/libv2ray.aar"
          echo "دانلود از: $URL"
          
          curl -L --fail -o app/libs/libXray.aar "$URL"
          
          if [ -f app/libs/libXray.aar ]; then
            SIZE=$(stat -c%s app/libs/libXray.aar)
            echo "✅ AAR دانلود شد — حجم: $SIZE بایت"
          else
            echo "❌ دانلود AAR ناموفق"
            exit 1
          fi

      # ═══════════════════════════════════════════════════
      #  مرحله ۴: ساخت فایل‌های Gradle
      # ═══════════════════════════════════════════════════
      - name: Create Gradle files
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "PARSAVPN"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.mlmvpn.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.mlmvpn.app"
                  minSdk = 24; targetSdk = 35
                  versionCode = 1; versionName = "1.0.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64") }
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              packaging { jniLibs { useLegacyPackaging = true } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation(files("libs/libXray.aar"))
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
              implementation("com.google.code.gson:gson:2.11.0")
          }
          EOF

      # ═══════════════════════════════════════════════════
      #  مرحله ۵: AndroidManifest.xml
      # ═══════════════════════════════════════════════════
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="PARSA VPN"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PARSAVPN">
                  <activity
                      android:name="com.mlmvpn.app.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.mlmvpn.app.RealVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="vpn_tunnel" />
                  </service>
                  <service
                      android:name="com.mlmvpn.app.CoreVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
                  <service
                      android:name="com.mlmvpn.app.ParsaTileService"
                      android:exported="true"
                      android:icon="@mipmap/ic_launcher"
                      android:label="PARSA VPN"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      # ═══════════════════════════════════════════════════
      #  مرحله ۶: منابع (Resources)
      # ═══════════════════════════════════════════════════
      - name: Create resources
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PARSA VPN</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="parsa_background">#07080D</color>
              <color name="ic_launcher_background">#07080D</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PARSAVPN" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@color/parsa_background</item>
                  <item name="android:navigationBarColor">@color/parsa_background</item>
                  <item name="android:windowBackground">@color/parsa_background</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7C4DFF"
                  android:pathData="M54,30L34,42v18c0,13.2 9.2,25.5 20,28 10.8,-2.5 20,-14.8 20,-28V42L54,30z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      # ═══════════════════════════════════════════════════
      #  مرحله ۷: دانلود Gradle Wrapper
      # ═══════════════════════════════════════════════════
      - name: Download Gradle wrapper
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew

      # ═══════════════════════════════════════════════════
      #  مرحله ۸: Build نهایی
      # ═══════════════════════════════════════════════════
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ═══════════════════════════════════════════════════
      #  مرحله ۹: آپلود APK
      # ═══════════════════════════════════════════════════
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PARSAVPN-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
